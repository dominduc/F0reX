<!doctype html><html lang="vi"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Hiên"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="theme-color" content="#f4f2eb"><title>Hiên — Nhật ký giao dịch</title><link rel="stylesheet" href="style.css"><body><main class="phone-app"><header class="app-header"><button class="brand" id="diary-title" aria-label="Đổi tên nhật ký">hiên</button><button id="settings-toggle" aria-label="Chọn theme màu"><svg width="25" height="25" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M12 3a9 9 0 1 0 0 18h1a2 2 0 0 0 1.4-3.4 1.8 1.8 0 0 1 1.3-3.1H18A3 3 0 0 0 21 11a9 9 0 0 0-9-8Z"/><circle cx="7.5" cy="10" r="1"/><circle cx="10" cy="6.5" r="1"/><circle cx="14.5" cy="6.5" r="1"/><circle cx="17" cy="10" r="1"/></svg></button></header><nav class="tabs"><button class="active" data-view="journal"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M5 4h12a2 2 0 0 1 2 2v14H7a3 3 0 0 1-3-3V5a1 1 0 0 1 1-1Z"/><path d="M4 16h15M8 8h7M8 11h5"/></svg><span>Nhật ký</span></button><button data-view="insights"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><rect x="4" y="5" width="16" height="15" rx="4"/><path d="M8 3v4m8-4v4M4 10h16m-12 4h1m3 0h1m3 0h1m-9 3h1m3 0h1"/></svg><span>Nhìn lại</span></button></nav><section id="journal"><span id="today" hidden></span><span id="count" hidden></span><div id="feed"></div></section><section id="insights" hidden><div class="analysis-controls"><select id="stats-pair" aria-label="Lọc hiệu suất theo cặp tiền"><option value="">Tất cả cặp tiền · Hiệu suất tổng</option></select></div><section class="stats" id="stats"></section><div id="calendar"></div><div id="analytics-detail"></div><div class="insight-grid" hidden><article><h3>Kết quả theo cặp tiền</h3><div id="pairs"></div></article><article><h3>Những điều mình đã giữ được</h3><div id="habits"></div></article></div></section></main><dialog id="name-editor"><form id="name-form"><div class="modal-head"><h2>Tên nhật ký</h2><button type="button" class="icon" id="name-close" aria-label="Đóng đổi tên">×</button></div><label>Tên<input id="name-input" type="text" maxlength="40" required autocomplete="off"></label><div class="form-bottom"><button class="primary" type="submit">Lưu tên</button></div></form></dialog><dialog id="theme-picker"><div class="modal-head"><div><div class="eyebrow">SẮC MÀU CỦA BẠN</div><h2>Một chút đổi gió.</h2></div><button class="icon" id="theme-close" aria-label="Đóng theme">×</button></div><div id="theme-options"></div></dialog><dialog id="detail"><div class="modal-head"><div><div class="eyebrow">MỘT ĐIỀU ĐÃ GIỮ LẠI</div><h2 id="detail-title"></h2></div><button class="icon" id="detail-close" aria-label="Đóng chi tiết">×</button></div><div id="detail-body"></div></dialog><dialog id="mood-picker"><div class="modal-head"><h2>Mình cảm thấy…</h2><button type="button" class="icon" id="mood-close" aria-label="Đóng cảm xúc">×</button></div><div id="mood-options"></div></dialog><dialog id="editor"><form id="form"><div class="modal-head"><div><div class="eyebrow">MỘT TRANG NHẬT KÝ</div><h2 id="formtitle">Hôm nay, mình ghi lại…</h2></div><button type="button" class="icon" id="close" aria-label="Đóng">×</button></div><div class="form-grid"><label>Cặp giao dịch<select id="pair" required></select></label><label>Thời gian<input type="datetime-local" id="when" required></label></div><div class="form-grid"><fieldset><legend>Hướng giao dịch</legend><div class="segmented"><label><input type="radio" name="side" value="Buy" checked><span>↗ Buy</span></label><label><input type="radio" name="side" value="Sell"><span>↘ Sell</span></label></div></fieldset><fieldset><legend>Kết quả (USD)</legend><div class="money-input"><select id="sign" aria-label="Lời hoặc lỗ"><option value="1">＋ Lời</option><option value="-1">− Lỗ</option></select><input id="amount" type="number" min="0" max="1000000000" step="0.01" required placeholder="0.00" aria-label="Số tiền"></div></fieldset></div><label>Ghi chú<textarea id="note" rows="4" maxlength="10000" placeholder="Mình đã thấy gì, cảm thấy gì, và học được điều gì?"></textarea></label><div class="photo-title">Hình ảnh <span id="photocount">0/4</span></div><div id="photos"></div><label class="upload">＋ Thêm ảnh vào trang nhật ký<input id="images" type="file" accept="image/*" multiple hidden></label><p id="error" role="alert"></p><div class="form-bottom"><button type="button" id="draft-mood" class="reaction-button" aria-label="Chọn cảm xúc">♡</button><button class="primary" id="save">Lưu trang nhật ký ↗</button></div></form></dialog><dialog id="viewer"><button class="icon" id="viewclose" aria-label="Đóng ảnh">×</button><img id="fullimage" alt="Ảnh nhật ký phóng lớn"></dialog><div id="toast" role="status"></div><script src="analytics.js"></script><script src="app.js"></script></body></html>
